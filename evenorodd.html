<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd</title>
</head>
<body>
    <script>
        function checkEvenOrOdd(n) {
            if (n % 2 === 0) {
                return "Even";
            } else {
                return "Odd";
            }
        }

        // Example usage:
        const number = 41; // Change this value to check a different number
        console.log(`The number ${number} is ${checkEvenOrOdd(number)}.`);
    </script>
</body>
</html>
