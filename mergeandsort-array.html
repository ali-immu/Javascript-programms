<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge and sort</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
        }

        h2 {
            margin-bottom: 12px;
        }

        pre {
            background: #111;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Merge and Sort Arrays</h2>
        <pre id="result"></pre>
    </div>

    <script>
        function mergeAndSortArrays(...arrays) {
            const merged = arrays.flat();
            console.log("merged array : " + merged);

            // Sort in descending order
            return merged.sort((a, b) => b - a);
        }

        const arr1 = [3, 12];
        const arr2 = [5, 1];
        const arr3 = [9, 4, 8];
        const arr4 = [10, 2, 6, 7];

        const result1 = mergeAndSortArrays(arr1, arr2);
        const result2 = mergeAndSortArrays(arr1, arr2, arr3, arr4);

        console.log(result1);
        console.log(result2);

        const output = document.getElementById('result');
        output.textContent = `Merged + Sorted (2 arrays): ${result1.join(', ')}\n\nMerged + Sorted (4 arrays): ${result2.join(', ')}`;
    </script>
</body>
</html>
