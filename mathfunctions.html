<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Functions</title>
</head>
<body>
    <script>
        function add(a, b) {
            return a + b;
        }

        function subtract(a, b) {
            return a - b;
        }

        function multiply(a, b) {
            return a * b;
        }

        function divide(a, b) {
            if (b === 0) {
                return "Division by zero is not allowed.";
            }
            return a / b;
        }

        // Example usage:
        const num1 = 10;
        const num2 = 5;

        console.log(`Addition: ${num1} + ${num2} = ${add(num1, num2)}`);
        console.log(`Subtraction: ${num1} - ${num2} = ${subtract(num1, num2)}`);
        console.log(`Multiplication: ${num1} * ${num2} = ${multiply(num1, num2)}`);
        console.log(`Division: ${num1} / ${num2} = ${divide(num1, num2)}`);

        const numb3 = 10.5;
        console.log(Math.round(numb3));
        console.log(Math.floor(numb3));
        console.log(Math.ceil(numb3));
        console.log(Math.trunc(numb3));
        console.log(Math.pow(2, 3));
        console.log(Math.sqrt(16));
        console.log(Math.abs(-10));
        console.log(Math.max(1, 2, 3, 4, 5));
        console.log(Math.min(1, 2, 3, 4, 5));
    </script>
</body>
</html>
