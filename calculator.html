<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0f4f8, #dfe9f3);
      }

      .calculator {
        width: 340px;
        background: #1f1f1f;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .display {
        width: 100%;
        height: 90px;
        background: #2e2e2e;
        color: white;
        border: none;
        border-radius: 12px;
        margin-bottom: 20px;
        text-align: right;
        padding: 20px;
        font-size: 2rem;
        letter-spacing: 1px;
        overflow: hidden;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 18px 10px;
        font-size: 1.3rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.95;
      }

      button:active {
        transform: scale(0.98);
      }

      .operator,
      .special {
        background: #ff9f1c;
        color: white;
      }

      .number {
        background: #e7e7e7;
        color: #111;
      }

      .zero {
        grid-column: span 2;
      }

      .equal {
        background: #2ec27e;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input type="text" class="display" id="display" disabled />

      <div class="buttons">
        <button class="special" onclick="clearDisplay()">C</button>
        <button class="special" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="appendValue('/')">/</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button class="number" onclick="appendValue('7')">7</button>
        <button class="number" onclick="appendValue('8')">8</button>
        <button class="number" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button class="number" onclick="appendValue('4')">4</button>
        <button class="number" onclick="appendValue('5')">5</button>
        <button class="number" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number" onclick="appendValue('1')">1</button>
        <button class="number" onclick="appendValue('2')">2</button>
        <button class="number" onclick="appendValue('3')">3</button>
        <button class="equal" onclick="calculateResult()" rowspan="2">=</button>

        <button class="number zero" onclick="appendValue('0')">0</button>
        <button class="number" onclick="appendValue('.')">.</button>
      </div>
    </div>

    <script>
      const display = document.getElementById('display');

      function appendValue(value) {
        display.value += value;
      }

      function clearDisplay() {
        display.value = '';
      }

      function deleteLast() {
        display.value = display.value.slice(0, -1);
      }

      function calculateResult() {
        try {
          const result = Function('return (' + display.value + ');')();
          display.value = result;
        } catch {
          display.value = 'Error';
        }
      }
    </script>
  </body>
</html>
