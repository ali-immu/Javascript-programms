<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial using while</title>
</head>
<body>
    <script>
        function factorial(n) {
            if (n < 0) {
                return "Factorial is not defined for negative numbers.";
            } else if (n === 0 || n === 1) {
                return 1;
            } else {
                let result = 1;
                let i = 2;
                while (i <= n) {
                    result *= i;
                    i++;
                }
                return result;
            }
        }

        // Example usage:
        const number = 5; // Change this value to compute the factorial of a different number
        console.log(`Factorial of ${number} is: ${factorial(number)}`);
    </script>
</body>
</html>
