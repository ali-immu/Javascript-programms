<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays in javascript</title>
</head>
<body>
    <script>
        const fruits = ['apple', 'banana', 'orange',"kiwi"];
        console.log(fruits);
        for (let i = 0; i < fruits.length; i++) {
            if (fruits[2 % i ===0]) {
                console.log(fruits[i]);
            }
        }
    </script>
</body>
</html>
