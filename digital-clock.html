<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body { display:flex; align-items:center; justify-content:center; height:100vh; margin:0; font-family: Arial, Helvetica, sans-serif; background:#111; color:#fff }
        #clock { font-size:4rem; letter-spacing:0.05em }
    </style>
</head>
<body>
    <div id="clock" aria-live="polite">--:--:--</div>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            console.log(`Hours : ${hours}`);
            const minutes = String(now.getMinutes()).padStart(2, '0');
            console.log(`minutes : ${minutes}`);
            const seconds = String(now.getSeconds()).padStart(2, '0');
            console.log(`seconds : ${seconds}`);
            const timeString = `${hours}:${minutes}:${seconds}`;
            const el = document.getElementById('clock');
            if (el) el.textContent = timeString;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
